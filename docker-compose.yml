services:
  postgres:
    image: postgres:16-alpine
    container_name: resourcehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fivem_resource_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - resourcehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fivem_resource_portal"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  resourcehub_pgdata:
